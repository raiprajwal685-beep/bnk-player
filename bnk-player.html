<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BNK Player</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--fg:#14161a;--mut:#6b7280;--bd:#e3e5ea;--ac:#4f7cff;--soft:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a21;--fg:#eceef2;--mut:#98a0ae;--bd:#262b35;--ac:#6b93ff;--soft:#222a3a}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a21;--fg:#eceef2;--mut:#98a0ae;--bd:#262b35;--ac:#6b93ff;--soft:#222a3a}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);scroll-behavior:smooth}
body{margin:0 auto;max-width:720px;padding:0 14px 90px;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;padding:10px 0;background:var(--bg)}
.nav a{padding:7px 14px;border-radius:999px;background:var(--soft);color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;transition:transform .15s,background .2s}
.nav a:active{transform:scale(.94)}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
.card:nth-of-type(2){animation-delay:.05s}.card:nth-of-type(3){animation-delay:.1s}.card:nth-of-type(4){animation-delay:.15s}
h2{display:flex;align-items:center;gap:10px;font-size:17px;margin:0 0 12px}
h2 i{width:26px;height:26px;border-radius:9px;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 13px system-ui;font-style:normal}
small,.st{color:var(--mut)}
.st{font-size:13px;margin-top:6px}
input[type=file]{width:100%;font-size:13px;color:var(--mut)}
input[type=file]::file-selector-button{border:1.5px dashed var(--ac);background:var(--soft);color:var(--fg);padding:10px 14px;border-radius:10px;margin-right:10px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,background .2s}
input[type=file]::file-selector-button:active{transform:scale(.96)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer;transition:transform .12s,filter .2s;touch-action:manipulation}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.95)}
button.ghost{background:var(--soft);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 0;border-top:1px solid var(--bd);animation:rise .35s cubic-bezier(.2,.8,.3,1) both}
.info{min-width:0;flex:1 1 150px}.info b{display:block;overflow-wrap:anywhere}.info small{display:block;overflow-wrap:anywhere}
.row.rep .info small{color:var(--ac)}
.acts{display:flex;flex-wrap:wrap;gap:6px}.acts button{padding:7px 12px;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#exp button{width:100%;margin-top:4px}
audio{width:100%;margin:10px 0}
canvas{max-width:100%;border-radius:12px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);max-width:min(92vw,520px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;opacity:0;transition:transform .4s cubic-bezier(.2,.9,.3,1.25),opacity .25s;z-index:20;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0);opacity:1}
.editor{border-top:3px solid var(--ac)}
.trk{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:12px 0;background:var(--bg);animation:pop .3s both}
.th{display:flex;justify-content:space-between;align-items:center;gap:8px}.th b{overflow-wrap:anywhere}.th small{margin-left:8px}
.th button{padding:5px 10px}
.trk canvas{width:100%;height:56px;display:block;margin:8px 0;background:var(--card);border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f span{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.f input{width:100%;min-width:0;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
.f input[type=range]{padding:0;height:34px;accent-color:var(--ac);border:0;background:none}
.wvbox{position:relative;margin-top:14px}
.wvbox canvas{width:100%;height:110px;display:block;background:var(--bg);border:1px solid var(--bd)}
#ph{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--ac);opacity:0;box-shadow:0 0 10px var(--ac);transition:opacity .2s}
.transport{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.transport #bp{flex:1 1 100%;padding:14px;font-size:16px}
.transport .ghost{flex:1}
.tobank{display:flex;gap:8px;flex-wrap:wrap}
.tobank select{flex:1;min-width:0;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}
#tl:empty::before{content:"No clips yet. Add .wem, .wav or .mp3 files, or tap Edit on a bank clip.";display:block;color:var(--mut);padding:16px;text-align:center;border:1.5px dashed var(--bd);border-radius:12px;margin:10px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<nav class="nav"><a href="#bank">Bank</a><a href="#unity">Unity</a><a href="#editor">Editor</a></nav>
<h1>BNK Player</h1><p class="sub">Play, edit and rebuild game audio and bundles.</p>
<section class="card" id="codebook"><h2><i>1</i>Codebook</h2><input type="file" id="cbf"><div class="st" id="cbs">Pick packed_codebooks_aoTuV_603.bin (or packed_codebooks.bin). It is remembered in this browser.</div></section>
<section class="card" id="bank"><h2><i>2</i>Wwise bank</h2><input type="file" id="bnk"><audio id="au" controls></audio><div id="exp"></div><div id="list"></div><input type="file" id="rf" hidden></section>
<section class="card" id="unity"><h2><i>3</i>Unity bundle</h2><input type="file" id="ub"><div class="st" id="us"></div><div id="ul"></div><input type="file" id="pf" accept="image/*" hidden><canvas id="cv" width="8" height="8" style="max-width:100%;display:none;margin-top:8px"></canvas><canvas id="c3" style="display:none;width:100%;height:340px;margin-top:8px"></canvas></section>
<section class="card editor" id="editor"><h2><i>4</i>Audio editor</h2>
<input type="file" id="af" multiple accept="audio/*,.wem">
<div id="tl"></div>
<div class="wvbox"><canvas id="wv" width="900" height="110"></canvas><div id="ph"></div></div>
<div class="st" id="as"></div>
<div class="transport"><button id="bp">&#9654; Play</button><button id="bj" class="ghost">Join in order</button><button id="bo" class="ghost">Overlay all</button><button id="bs" class="ghost">Save .wav</button></div>
<div class="tobank"><select id="tsel"></select><button id="bb">Put in bank</button></div></section>
<div id="msg" class="toast"></div>
<script>
const $=i=>document.getElementById(i),say=t=>{const m=$('msg');m.textContent=t;m.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>m.classList.remove('show'),/^Error/.test(t)?7000:3500)};
const ilog=v=>{let r=0;while(v){r++;v>>>=1}return r};
class BR{constructor(b){this.b=b;this.p=0}
read(n){let v=0;for(let i=0;i<n;i++){const y=this.b[this.p>>3];if(y===undefined)throw Error('Bad codebook data (wrong codebook file?)');v|=((y>>(this.p&7))&1)<<i;this.p++}return v>>>0}}
class BW{constructor(){this.a=[];this.c=0;this.n=0}
w(v,n){for(let i=0;i<n;i++){this.c|=((v>>>i)&1)<<this.n;if(++this.n==8){this.a.push(this.c);this.c=0;this.n=0}}}
done(){if(this.n){this.a.push(this.c);this.c=0;this.n=0}return this.a}}
let lib=null;
function setLib(u8){const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength),t=dv.getUint32(u8.length-4,true),n=(u8.length-t)/4,off=[];
for(let i=0;i<n;i++)off.push(dv.getUint32(t+i*4,true));lib={d:u8,off};$('cbs').textContent='Codebook loaded ('+(n-1)+' books).'}
$('cbf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const u=new Uint8Array(await f.arrayBuffer());try{setLib(u);let s='';for(const x of u)s+=String.fromCharCode(x);localStorage.setItem('cb',btoa(s))}catch(x){}};
try{const s=localStorage.getItem('cb');if(s)setLib(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}catch(x){}
function qv(e,d){const b=ilog(e);let v=e>>>Math.floor((b-1)*(d-1)/d);for(;;){let a=1,c=1;for(let i=0;i<d;i++){a*=v;c*=v+1}if(a<=e&&c>e)return v;v+=a>e?-1:1}}
function cbk(id,w){if(id+1>=lib.off.length)throw Error('Codebook id '+id+' not in this codebook file');
const r=new BR(lib.d.subarray(lib.off[id],lib.off[id+1])),dim=r.read(4),ent=r.read(14);
w.w(0x564342,24);w.w(dim,16);w.w(ent,24);const o=r.read(1);w.w(o,1);
if(o){w.w(r.read(5),5);let c=0;while(c<ent){const b=ilog(ent-c),n=r.read(b);w.w(n,b);c+=n}}
else{const l=r.read(3),sp=r.read(1);if(!l||l>5)throw Error('Bad codebook (wrong codebook file?)');w.w(sp,1);
for(let i=0;i<ent;i++){let p=1;if(sp){p=r.read(1);w.w(p,1)}if(p)w.w(r.read(l),5)}}
const lt=r.read(1);w.w(lt,4);
if(lt){w.w(r.read(32),32);w.w(r.read(32),32);const vl=r.read(4);w.w(vl,4);w.w(r.read(1),1);const q=qv(ent,dim);for(let i=0;i<q;i++)w.w(r.read(vl+1),vl+1)}}
function setup(W,I){const s=I.d+I.so,sz=W[s]|W[s+1]<<8,r=new BR(W.subarray(s+2,s+2+sz)),w=new BW(),cp=n=>{const v=r.read(n);w.w(v,n);return v};
w.w(5,8);for(const c of'vorbis')w.w(c.charCodeAt(0),8);
const nc=r.read(8)+1;w.w(nc-1,8);for(let i=0;i<nc;i++)cbk(r.read(10),w);
w.w(0,6);w.w(0,16);
const fc=r.read(6)+1;w.w(fc-1,6);
for(let f=0;f<fc;f++){w.w(1,16);const np=cp(5),pl=[];let mx=0;for(let j=0;j<np;j++){const c=cp(4);pl.push(c);mx=Math.max(mx,c)}
const cd=[];for(let j=0;j<=mx;j++){cd[j]=cp(3)+1;const sc=cp(2);if(sc)cp(8);for(let k=0;k<1<<sc;k++)cp(8)}
cp(2);const rb=cp(4);for(let j=0;j<np;j++)for(let k=0;k<cd[pl[j]];k++)cp(rb)}
const rc=r.read(6)+1;w.w(rc-1,6);
for(let i=0;i<rc;i++){w.w(r.read(2),16);cp(24);cp(24);cp(24);const n=cp(6)+1;cp(8);const cs=[];
for(let j=0;j<n;j++){const lo=cp(3);let hi=0;if(cp(1))hi=cp(5);cs.push(hi*8+lo)}
for(let j=0;j<n;j++)for(let k=0;k<8;k++)if(cs[j]&1<<k)cp(8)}
const mc=r.read(6)+1;w.w(mc-1,6);
for(let i=0;i<mc;i++){w.w(0,16);let sm=1;if(cp(1))sm=cp(4)+1;if(cp(1)){const n=cp(8)+1,b=ilog(I.ch-1);for(let j=0;j<n;j++){cp(b);cp(b)}}
cp(2);if(sm>1)for(let k=0;k<I.ch;k++)cp(4);for(let j=0;j<sm;j++){cp(8);cp(8);cp(8)}}
const mo=r.read(6)+1;w.w(mo-1,6);const fl=[];
for(let i=0;i<mo;i++){fl.push(cp(1));w.w(0,16);w.w(0,16);cp(8)}
w.w(1,1);return{b:Uint8Array.from(w.done()),fl,bits:ilog(mo-1)}}
const T=(()=>{const t=[];for(let i=0;i<256;i++){let r=i<<24;for(let j=0;j<8;j++)r=r&0x80000000?(r<<1)^0x04c11db7:r<<1;t[i]=r>>>0}return t})();
function page(pk,g,q,f){const sg=[];let L=0;for(const p of pk){let n=p.length;while(n>=255){sg.push(255);n-=255}sg.push(n);L+=p.length}
const b=new Uint8Array(27+sg.length+L),v=new DataView(b.buffer);b.set([79,103,103,83,0,f]);
v.setUint32(6,g%4294967296,true);v.setUint32(10,Math.floor(g/4294967296),true);v.setUint32(14,1,true);v.setUint32(18,q,true);b[26]=sg.length;b.set(sg,27);
let o=27+sg.length;for(const p of pk){b.set(p,o);o+=p.length}
let c=0;for(let i=0;i<b.length;i++)c=((c<<8)^T[((c>>>24)&255)^b[i]])>>>0;v.setUint32(22,c,true);return b}
function info(W){const v=new DataView(W.buffer,W.byteOffset,W.byteLength);let p=12,F,D,V;
while(p+8<=W.length){const t=String.fromCharCode(...W.subarray(p,p+4)),s=v.getUint32(p+4,true);if(t=='fmt ')F=[p+8,s];else if(t=='data')D=[p+8,s];else if(t=='vorb')V=[p+8,s];p+=8+s+(s&1)}
if(!F||!D||v.getUint16(F[0],true)!=0xFFFF)throw Error('Not Wwise Vorbis audio');
const vo=V?V[0]:F[0]+0x18,vs=V?V[1]:F[1]-0x18;if(vs!=0x2A)throw Error('Unsupported header variant 0x'+vs.toString(16));
const m=v.getUint32(vo+4,true);if([0x4A,0x4B,0x69,0x70].includes(m))throw Error('Unmodified packets not supported');
return{ch:v.getUint16(F[0]+2,true),rate:v.getUint32(F[0]+4,true),avg:v.getUint32(F[0]+8,true),n:v.getUint32(vo,true),so:v.getUint32(vo+16,true),fa:v.getUint32(vo+20,true),b0:W[vo+0x28],b1:W[vo+0x29],d:D[0],e:Math.min(W.length,D[0]+D[1])}}
function toOgg(W){if(!lib)throw Error('Load the codebook file first (step 1)');
const I=info(W),S=setup(W,I),id=new Uint8Array(30),v=new DataView(id.buffer);
id[0]=1;id.set([118,111,114,98,105,115],1);id[11]=I.ch;v.setUint32(12,I.rate,true);v.setUint32(20,I.avg*8,true);id[28]=I.b0|I.b1<<4;id[29]=1;
const vend=[...'wem2js'].map(c=>c.charCodeAt(0)),cm=Uint8Array.from([3,118,111,114,98,105,115,vend.length,0,0,0,...vend,0,0,0,0,1]);
const pk=[];for(let p=I.d+I.fa;p+2<=I.e;){const n=W[p]|W[p+1]<<8;pk.push(W.subarray(p+2,p+2+n));p+=2+n}
const mk=(1<<S.bits)-1,out=[page([id],0,0,2),page([cm,S.b],0,1,0)];let pf=0,pb=0,g=0;
pk.forEach((d,i)=>{const w=new BW(),m=d[0]&mk,bf=S.fl[m];w.w(0,1);w.w(m,S.bits);
if(bf){const nx=pk[i+1];w.w(pf,1);w.w(nx&&nx.length?S.fl[nx[0]&mk]:0,1)}
w.w(d[0]>>S.bits,8-S.bits);for(let j=1;j<d.length;j++)w.w(d[j],8);
const bs=1<<(bf?I.b1:I.b0);if(pb)g+=pb/4+bs/4;pb=bs;pf=bf;
const last=i==pk.length-1;out.push(page([Uint8Array.from(w.done())],last?Math.min(g,I.n):g,i+2,last?4:0))});
let L=0;for(const o of out)L+=o.length;const r=new Uint8Array(L);let o=0;for(const x of out){r.set(x,o);o+=x.length}return r}
let RAW=null,CL=[],NAME='';
function parseBnk(u){const v=new DataView(u.buffer,u.byteOffset,u.byteLength);let p=0,D,X;
while(p+8<=u.length){const t=String.fromCharCode(...u.subarray(p,p+4)),s=v.getUint32(p+4,true);if(t=='DIDX')X=[p+8,s];if(t=='DATA')D=p+8;p+=8+s}
if(!X||D===undefined)throw Error('No embedded audio in this bank (it may only hold events)');
const r=[];for(let i=0;i<X[1]/12;i++){const q=X[0]+i*12,id=v.getUint32(q,true),o=v.getUint32(q+4,true),s=v.getUint32(q+8,true);r.push({id,wem:u.subarray(D+o,D+o+s)})}return r}
function wavParse(b){const v=new DataView(b.buffer,b.byteOffset,b.byteLength);if(TD.decode(b.subarray(0,4))!='RIFF')throw Error('Not a WAV or WEM file');
let p=12,F,D;while(p+8<=b.length){const t=TD.decode(b.subarray(p,p+4)),s=v.getUint32(p+4,true);if(t=='fmt ')F=p+8;else if(t=='data')D=[p+8,Math.min(s,b.length-p-8)];p+=8+s+(s&1)}
if(F===undefined||!D)throw Error('Broken WAV');return{tag:v.getUint16(F,true),ch:v.getUint16(F+2,true),rate:v.getUint32(F+4,true),bits:v.getUint16(F+14,true),d:b.subarray(D[0],D[0]+D[1])}}
function pcmWem(w){const n=w.d.length,o=new Uint8Array(44+n),v=new DataView(o.buffer);o.set([82,73,70,70]);v.setUint32(4,36+n,true);o.set([87,65,86,69,102,109,116,32],8);
v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,w.ch,true);v.setUint32(24,w.rate,true);v.setUint32(28,w.rate*w.ch*2,true);v.setUint16(32,w.ch*2,true);v.setUint16(34,16,true);
o.set([100,97,116,97],36);v.setUint32(40,n,true);o.set(w.d,44);return o}
function replace(c,b){const w=wavParse(b);
if(w.tag==1){if(w.bits!=16)throw Error('WAV must be 16-bit PCM');c.wem=pcmWem(w);c.pcm=1;c.mem=w.d.length}
else if(w.tag==0xFFFF){c.wem=b;c.pcm=0}else throw Error('Use a 16-bit PCM WAV or a Wwise .wem');
c.rep=1;c.url=null}
function exportBnk(){const u=RAW,v=new DataView(u.buffer,u.byteOffset,u.byteLength),rep=new Map(CL.filter(c=>c.pcm).map(c=>[c.id,c]));
const dp=[],ix=new Uint8Array(CL.length*12),iv=new DataView(ix.buffer);let off=0;
CL.forEach((c,i)=>{if(c.wem.length){const pad=(16-off%16)%16;if(pad){dp.push(new Uint8Array(pad));off+=pad}}
iv.setUint32(i*12,c.id,true);iv.setUint32(i*12+4,off,true);iv.setUint32(i*12+8,c.wem.length,true);dp.push(c.wem);off+=c.wem.length});
const dat=new Uint8Array(off);let o=0;for(const x of dp){dat.set(x,o);o+=x.length}
const out=[];let p=0;
while(p+8<=u.length){const t=String.fromCharCode(...u.subarray(p,p+4)),s=v.getUint32(p+4,true);let body=u.subarray(p+8,p+8+s);
if(t=='DIDX')body=ix;else if(t=='DATA')body=dat;
else if(t=='HIRC'&&rep.size){body=body.slice();const h=new DataView(body.buffer),n=h.getUint32(0,true);let q=4;
for(let i=0;i<n;i++){const ty=body[q],sz=h.getUint32(q+1,true),b=q+5;if(ty==2){const c=rep.get(h.getUint32(b+9,true));if(c){h.setUint32(b+4,0x10001,true);h.setUint32(b+13,c.mem,true)}}q+=5+sz}}
const hd=new Uint8Array(8);hd.set(u.subarray(p,p+4));new DataView(hd.buffer).setUint32(4,body.length,true);out.push(hd,body);p+=8+s}
let L=0;for(const x of out)L+=x.length;const r=new Uint8Array(L);o=0;for(const x of out){r.set(x,o);o+=x.length}return r}
const au=$('au'),rf=$('rf');let tgt=null;
async function play(c){try{say('Converting…');if(!c.url)c.url=URL.createObjectURL(new Blob([c.pcm?c.wem:toOgg(c.wem)],{type:c.pcm?'audio/wav':'audio/ogg'}));au.src=c.url;await au.play();say('Playing '+c.id)}catch(e){say('Error: '+e.message)}}
function render(){const L=$('list');L.innerHTML='';let n=0;
